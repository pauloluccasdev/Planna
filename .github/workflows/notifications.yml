name: Notification dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Synchronize and deliver due notifications
        env:
          CRON_SECRET: ${{ secrets.PLANNA_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://planna-api.vercel.app/api/v1/internal/notifications/dispatch
