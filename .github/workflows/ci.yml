name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: http://localhost:3001/api/v1
      DATABASE_URL: postgresql://planna:planna@localhost:5432/planna
      DIRECT_URL: postgresql://planna:planna@localhost:5432/planna
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWKS_URL: https://example.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SECRET_KEY: ci-secret-key
      SUPABASE_URL: https://example.supabase.co

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate database schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build applications
        run: npm run build
